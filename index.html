<!DOCTYPE html><html lang='th'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><title>Study Schedule V6.2</title><link rel='manifest' href='manifest.json'><link rel='stylesheet' href='css/style.css'></head><body>
<header><h1>📚 Study Schedule V6.2</h1><button id=today>วันนี้</button></header>
<main>
<section class=calendar><div class=nav><button id=prev>◀</button><h2 id=month></h2><button id=next>▶</button></div><div class=week>อา จ อ พ พฤ ศ ส</div><div id=grid class=grid></div></section>
<section class=card><h3 id=selTitle></h3><div class=row><input id=s type=time step=300><input id=e type=time step=300></div><input id=sub placeholder='ชื่อวิชา'><input id=teacher list=teachers placeholder='ชื่อครูผู้สอน'><datalist id=teachers></datalist><select id=repeat><option value=once>เฉพาะวันนี้</option><option value=weekly>ทุกสัปดาห์</option></select><select id=weekday><option value=1>จันทร์</option><option value=2>อังคาร</option><option value=3>พุธ</option><option value=4>พฤหัส</option><option value=5>ศุกร์</option><option value=6>เสาร์</option><option value=0>อาทิตย์</option></select><button id=add>บันทึก</button><button id=copy class=green>คัดลอกทั้งสัปดาห์</button></section>
<ul id=list></ul></main><script src='js/app.js'></script></body></html>
