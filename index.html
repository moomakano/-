<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Study Schedule V6</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="css/style.css"></head><body>
<header><h1>📚 Study Schedule V6</h1></header>
