<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Multi-Page Pro Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <meta name="theme-color" content="#2563eb">
    <style>
        html, body {
            margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; position: fixed;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f3f4f6;
        }
    </style>
</head>
<body class="flex justify-center items-center">
    <div class="w-full max-w-md h-full bg-white flex flex-col justify-between relative shadow-2xl overflow-hidden">
        
        <!-- หน้าจอหลัก -->
        <div id="screen-home" class="flex flex-col h-full absolute inset-0 bg-white z-10">
            <header class="px-6 pt-10 pb-4 bg-white flex justify-between items-center border-b border-gray-100">
                <h1 class="text-2xl font-bold text-gray-800">Pro Multi-Scanner</h1>
                <span id="page-counter" class="bg-blue-50 text-blue-600 px-3 py-1 rounded-full text-xs font-semibold">0 หน้า</span>
            </header>

            <main class="flex-grow p-6 flex flex-col items-center justify-center text-center">
                <div class="w-24 h-24 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center text-4xl mb-4 shadow-inner">
                    <i class="fa-solid fa-copy"></i>
                </div>
                <h2 class="text-lg font-semibold text-gray-800 mb-2">สแกนเอกสารต่อเนื่องหลายหน้า</h2>
                <p class="text-xs text-gray-400 max-w-xs mb-8">ถ่ายภาพเอกสาร ระบบจะลบรอยดินสออัตโนมัติ และสะสมหน้ากระดาษเป็น PDF ชุดเดียว</p>
            </main>

            <nav class="bg-white border-t border-gray-100 py-6 px-6 flex justify-around items-center">
                <button onclick="document.getElementById('camera-input').click()" class="bg-blue-600 text-white w-16 h-16 rounded-full shadow-lg flex items-center justify-center text-2xl active:scale-95 transition">
                    <i class="fa-solid fa-camera"></i>
                </button>
                <button onclick="finishAndDownloadPDF()" class="bg-green-600 text-white px-6 py-3 rounded-full shadow-lg font-medium text-sm flex items-center space-x-2 active:scale-95 transition">
                    <i class="fa-solid fa-file-pdf"></i><span>สร้าง PDF (<span id="btn-count">0</span>)</span>
                </button>
                <input type="file" id="camera-input" class="hidden" accept="image/*" capture="environment" onchange="handleImageProcess(event)">
            </nav>
        </div>
    </div>

    <canvas id="process-canvas" class="hidden"></canvas>

    <script>
        let scannedPages = [];

        function handleImageProcess(e) {
            if (e.target.files && e.target.files[0]) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.getElementById('process-canvas');
                        canvas.width = img.width;
                        canvas.height = img.height;
                        const ctx = canvas.getContext('2d');
                        
                        ctx.drawImage(img, 0, 0);
                        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        const data = imgData.data;

                        // ลบรอยดินสอและปรับพื้นหลังให้ขาว 100%
                        for (let i = 0; i < data.length; i += 4) {
                            let avg = (data[i] * 0.3) + (data[i+1] * 0.59) + (data[i+2] * 0.11);
                            if (avg > 165) {
                                data[i] = 255; data[i+1] = 255; data[i+2] = 255;
                            } else {
                                data[i] = Math.min(255, data[i] * 0.7);
                                data[i+1] = Math.min(255, data[i+1] * 0.7);
                                data[i+2] = Math.min(255, data[i+2] * 0.7);
                            }
                        }

                        ctx.putImageData(imgData, 0, 0);
                        scannedPages.push(canvas.toDataURL('image/jpeg', 0.9));
                        
                        // อัปเดตจำนวนหน้า
                        document.getElementById('page-counter').innerText = scannedPages.length + ' หน้า';
                        document.getElementById('btn-count').innerText = scannedPages.length;
                        document.getElementById('camera-input').value = '';
                        alert('เพิ่มหน้าเอกสารสำเร็จ (รวม ' + scannedPages.length + ' หน้า)');
                    };
                    img.src = evt.target.result;
                };
                reader.readAsDataURL(e.target.files[0]);
            }
        }

        function finishAndDownloadPDF() {
            if (scannedPages.length === 0) {
                alert('กรุณาถ่ายภาพเอกสารอย่างน้อย 1 หน้าก่อนสร้าง PDF');
                return;
            }
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            scannedPages.forEach((imgData, index) => {
                if (index > 0) doc.addPage();
                doc.addImage(imgData, 'JPEG', 10, 10, 190, 277);
            });

            doc.save('document-collection-' + Date.now() + '.pdf');
            scannedPages = [];
            document.getElementById('page-counter').innerText = '0 หน้า';
            document.getElementById('btn-count').innerText = '0';
        }
    </script>
</body>
</html>
