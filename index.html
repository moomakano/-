<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V14.3 Instant Open</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;background:#fff7fb;margin:0}
header{padding:18px;text-align:center;background:#ff2f7d;color:#fff}
main{padding:20px}
button{border:none;border-radius:16px;padding:14px 18px;font-size:16px;cursor:pointer}
#micBtn{background:#ff2f7d;color:#fff;width:100%}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end}
.modal.show{display:flex}
.card{background:#fff;width:100%;border-radius:28px 28px 0 0;padding:20px}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;margin:6px 0 12px}
.days{display:flex;flex-wrap:wrap;gap:8px}
.day-btn{padding:8px 12px;border-radius:999px;background:#eee}
.day-btn.active{background:#ff2f7d;color:#fff}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:999px;display:none}
.toast.show{display:block}
</style>
</head>
<body>
<header><h2>V14.3 Instant Open</h2></header>
<main>
<p>กดไมค์แล้วพูด เช่น "วันจันทร์ ภาษาอังกฤษ สี่โมงครึ่ง ครูเต๋า ดาวหนึ่ง"</p>
<button id="micBtn">🎤 พูดเพื่อเพิ่มวิชา</button>
</main>

<div class="modal" id="modal">
<div class="card">
<h2>➕ เพิ่มวิชาเรียนใหม่</h2>
<input id="subjectName" placeholder="วิชา">
<div class="days">
<span class="day-btn" data-day="mon">จ</span>
<span class="day-btn" data-day="tue">อ</span>
<span class="day-btn" data-day="wed">พ</span>
<span class="day-btn" data-day="thu">พฤ</span>
<span class="day-btn" data-day="fri">ศ</span>
<span class="day-btn" data-day="sat">ส</span>
<span class="day-btn" data-day="sun">อา</span>
</div>
<input id="startTime" placeholder="เวลาเริ่ม">
<input id="endTime" placeholder="เวลาเลิก">
<input id="teacherName" placeholder="ครู">
<input id="starReward" placeholder="ดาว">
<button id="saveSubjectBtn" style="background:#ff2f7d;color:white;width:100%">บันทึกวิชา</button>
</div>
</div>

<div id="toast" class="toast"></div>

<script>
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
let parsed={};
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}
function play(){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=900;o.start();g.gain.setValueAtTime(.12,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.18);o.stop(c.currentTime+.18);}catch(e){}}
function openModal(){document.getElementById('modal').classList.add('show')}
function selectDay(d){document.querySelectorAll('.day-btn').forEach(b=>b.classList.toggle('active',b.dataset.day===d))}
function fill(d){subjectName.value=d.subject||'';teacherName.value=d.teacher||'';startTime.value=d.startTime||'';endTime.value=d.endTime||'';starReward.value=d.stars||'';selectDay(d.day)}
function parse(txt){
 let r={};
 if(txt.includes('อังกฤษ'))r.subject='อังกฤษ';
 if(txt.includes('คณิต'))r.subject='คณิต';
 if(txt.includes('วิทย์'))r.subject='วิทย์';
 if(txt.includes('ไทย'))r.subject='ไทย';
 const m=txt.match(/ครู([ก-๙A-Za-z]+)/); if(m)r.teacher='ครู'+m[1];
 if(txt.includes('วันจันทร์'))r.day='mon';
 if(txt.includes('วันอังคาร'))r.day='tue';
 if(txt.includes('วันพุธ'))r.day='wed';
 if(txt.includes('วันพฤหัส'))r.day='thu';
 if(txt.includes('วันศุกร์'))r.day='fri';
 if(txt.includes('วันเสาร์'))r.day='sat';
 if(txt.includes('วันอาทิตย์'))r.day='sun';
 if(txt.includes('สี่โมงครึ่ง')){r.startTime='16:30';r.endTime='17:30'}
 if(txt.includes('ดาวหนึ่ง'))r.stars='1';
 return r;
}
if(SpeechRecognition){
 const rec=new SpeechRecognition();rec.lang='th-TH';rec.interimResults=false;
 micBtn.onclick=()=>rec.start();
 rec.onresult=e=>parsed=parse(Array.from(e.results).map(r=>r[0].transcript).join(''));
 rec.onend=()=>{fill(parsed);openModal();navigator.vibrate?.(30);play();toast('เติมข้อมูลเรียบร้อยแล้ว ✓');saveSubjectBtn.focus();}
}else{
 micBtn.onclick=()=>alert('เบราว์เซอร์นี้ไม่รองรับ Speech Recognition');
}
saveSubjectBtn.onclick=()=>{toast('บันทึกวิชาแล้ว ✓');modal.classList.remove('show')}
</script>
</body>
</html>
