<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Easy Scanner PWA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <meta name="theme-color" content="#2563eb">
    <style>
        /* ลบ Scrollbar และล็อกหน้าจอไม่ให้ขยับเกินหน้าจอ */
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: fixed;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="flex justify-center items-center">

    <div id="app-container" class="w-full max-w-md h-full bg-white flex flex-col justify-between relative shadow-2xl overflow-hidden">

        <!-- 1. หน้าจอหลัก (Home) -->
        <div id="screen-home" class="flex flex-col h-full absolute inset-0 bg-white z-10">
            <header class="px-6 pt-10 pb-4 bg-white flex justify-between items-center">
                <h1 class="text-2xl font-bold text-gray-800">สแกนเอกสาร</h1>
                <button onclick="document.getElementById('gallery-input').click()" class="bg-blue-50 text-blue-600 px-4 py-2 rounded-full text-sm font-medium flex items-center space-x-2">
                    <i class="fa-solid fa-image"></i><span>เลือกรูปภาพ</span>
                </button>
                <input type="file" id="gallery-input" class="hidden" accept="image/*" onchange="handleImageSelect(event)">
            </header>

            <main class="flex-grow p-6 flex flex-col items-center justify-center text-center">
                <div class="w-24 h-24 bg-blue-50 text-blue-500 rounded-full flex items-center justify-center text-4xl mb-4 shadow-inner">
                    <i class="fa-solid fa-camera-retro"></i>
                </div>
                <h2 class="text-lg font-semibold text-gray-700 mb-2">พร้อมสแกนเอกสารของคุณแล้ว</h2>
                <p class="text-xs text-gray-400 max-w-xs mb-8">กดปุ่มกล้องด้านล่างเพื่อถ่ายภาพเอกสาร หรือเลือกรูปจากอัลบั้มเพื่อแปลงเป็น PDF ทันที</p>
            </main>

            <nav class="bg-white border-t border-gray-100 py-4 px-6 flex justify-center items-center">
                <button onclick="openCamera()" class="bg-blue-600 text-white w-16 h-16 rounded-full shadow-lg flex items-center justify-center text-2xl hover:bg-blue-700 active:scale-95 transition">
                    <i class="fa-solid fa-camera"></i>
                </button>
            </nav>
        </div>

        <!-- 2. หน้าจอถ่ายภาพจากกล้อง (Camera) -->
        <div id="screen-camera" class="hidden flex flex-col h-full absolute inset-0 bg-black z-20">
            <div class="p-4 flex justify-between items-center text-white z-10">
                <button onclick="closeCamera()" class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center text-lg"><i class="fa-solid fa-xmark"></i></button>
                <span class="text-sm font-medium">จัดเอกสารให้อยู่ในกรอบ</span>
                <div class="w-10"></div>
            </div>

            <div class="flex-grow relative flex items-center justify-center overflow-hidden">
                <video id="camera-stream" autoplay playsinline class="absolute inset-0 w-full h-full object-cover"></video>
                <canvas id="capture-canvas" class="hidden"></canvas>
                <!-- กรอบเล็งเอกสารเข้าใจง่าย -->
                <div class="border-2 border-white/80 rounded-xl w-4/5 h-3/5 absolute pointer-events-none shadow-2xl"></div>
            </div>

            <div class="p-6 bg-black/80 flex justify-around items-center z-10">
                <div class="w-10"></div>
                <button onclick="takeSnapshot()" class="w-16 h-16 rounded-full border-4 border-white bg-white flex items-center justify-center active:scale-90 transition">
                    <div class="w-12 h-12 bg-blue-600 rounded-full"></div>
                </button>
                <button onclick="switchCamera()" class="w-10 h-10 rounded-full bg-white/20 text-white flex items-center justify-center text-sm"><i class="fa-solid fa-rotate"></i></button>
            </div>
        </div>

        <!-- 3. หน้าจอปรับแต่งและบันทึก PDF (Editor) -->
        <div id="screen-editor" class="hidden flex flex-col h-full absolute inset-0 bg-white z-30">
            <header class="px-4 py-3 flex justify-between items-center border-b border-gray-100">
                <button onclick="backToHome()" class="text-gray-600 text-base px-2 py-1"><i class="fa-solid fa-chevron-left"></i> ย้อนกลับ</button>
                <h2 class="font-semibold text-sm text-gray-800">ตัวอย่างเอกสาร</h2>
                <div class="w-12"></div>
            </header>

            <main class="flex-grow bg-gray-100 p-4 flex items-center justify-center overflow-hidden">
                <div class="bg-white p-2 rounded-xl shadow border border-gray-200 max-h-full flex items-center justify-center">
                    <img id="preview-image" class="max-h-[60vh] w-auto object-contain rounded" alt="Scanned">
                </div>
            </main>

            <div class="p-4 bg-white border-t border-gray-100 flex space-x-3">
                <button onclick="downloadPDF()" class="flex-1 bg-gray-100 text-gray-700 py-3 rounded-xl font-medium text-sm flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-download"></i><span>ดาวน์โหลด PDF</span>
                </button>
                <button onclick="saveAndReset()" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-medium text-sm flex items-center justify-center space-x-2 shadow-md">
                    <i class="fa-solid fa-check"></i><span>เสร็จสิ้น</span>
                </button>
            </div>
        </div>

    </div>

    <script>
        let mediaStream = null;
        let useFrontCamera = false;

        async function openCamera() {
            document.getElementById('screen-home').classList.add('hidden');
            document.getElementById('screen-camera').classList.remove('hidden');
            startCameraStream();
        }

        async function startCameraStream() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
            }
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: useFrontCamera ? 'user' : 'environment' } 
                });
                document.getElementById('camera-stream').srcObject = mediaStream;
            } catch (err) {
                alert('ไม่สามารถเปิดกล้องได้ กรุณาตรวจสอบสิทธิ์การใช้งานกล้อง');
                closeCamera();
            }
        }

        function switchCamera() {
            useFrontCamera = !useFrontCamera;
            startCameraStream();
        }

        function closeCamera() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
            document.getElementById('screen-camera').classList.add('hidden');
            document.getElementById('screen-home').classList.remove('hidden');
        }

        function takeSnapshot() {
            const video = document.getElementById('camera-stream');
            const canvas = document.getElementById('capture-canvas');
            canvas.width = video.videoWidth || 1280;
            canvas.height = video.videoHeight || 720;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            document.getElementById('preview-image').src = canvas.toDataURL('image/jpeg', 0.9);
            closeCamera();
            document.getElementById('screen-editor').classList.remove('hidden');
        }

        function handleImageSelect(e) {
            if (e.target.files && e.target.files[0]) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    document.getElementById('preview-image').src = evt.target.result;
                    document.getElementById('screen-editor').classList.remove('hidden');
                };
                reader.readAsDataURL(e.target.files[0]);
            }
        }

        function backToHome() {
            document.getElementById('screen-editor').classList.add('hidden');
            document.getElementById('screen-home').classList.remove('hidden');
        }

        function downloadPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const imgData = document.getElementById('preview-image').src;
            
            // วางภาพลงใน PDF ขนาดมาตรฐาน A4
            doc.addImage(imgData, 'JPEG', 10, 10, 190, 277);
            doc.save('document-' + Date.now() + '.pdf');
        }

        function saveAndReset() {
            downloadPDF();
            backToHome();
        }
    </script>
</body>
</html>
