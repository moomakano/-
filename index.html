<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Real Mobile Scanner Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <meta name="theme-color" content="#111827">
    <style>
        html, body {
            margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; position: fixed;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #000;
        }
    </style>
</head>
<body class="flex justify-center items-center">

    <div class="w-full max-w-md h-full bg-black flex flex-col justify-between relative shadow-2xl overflow-hidden text-white">

        <!-- 1. หน้าจอหลัก (แกลเลอรีหน้ารวม) -->
        <div id="screen-home" class="flex flex-col h-full absolute inset-0 bg-gray-950 z-10">
            <header class="px-6 pt-10 pb-4 bg-gray-900 flex justify-between items-center border-b border-gray-800">
                <div>
                    <h1 class="text-xl font-bold tracking-tight">Mobile Scanner Pro</h1>
                    <span id="doc-count" class="text-xs text-gray-400">เอกสาร: 0 หน้า</span>
                </div>
                <button onclick="openCameraScreen()" class="bg-blue-600 text-white px-4 py-2 rounded-full text-sm font-medium flex items-center space-x-2 shadow-lg">
                    <i class="fa-solid fa-camera"></i><span>เปิดกล้องสแกน</span>
                </button>
            </header>

            <main class="flex-grow p-4 overflow-y-auto">
                <div id="thumbnail-grid" class="grid grid-cols-2 gap-3">
                    <div id="empty-state" class="col-span-2 flex flex-col items-center justify-center py-24 text-gray-500">
                        <i class="fa-solid fa-file-lines text-5xl mb-3 opacity-40"></i>
                        <p class="text-sm">ยังไม่มีเอกสาร กดปุ่ม "เปิดกล้องสแกน" ด้านบน</p>
                    </div>
                </div>
            </main>

            <footer class="bg-gray-900 border-t border-gray-800 p-4 flex justify-between items-center">
                <button onclick="document.getElementById('gallery-input').click()" class="text-gray-300 text-sm flex items-center space-x-2">
                    <i class="fa-solid fa-image text-lg"></i><span>นำเข้ารูปภาพ</span>
                </button>
                <button onclick="generatePDF()" id="pdf-btn" class="hidden bg-emerald-600 text-white px-5 py-2.5 rounded-full text-sm font-medium flex items-center space-x-2 shadow-lg">
                    <i class="fa-solid fa-file-pdf"></i><span>บันทึก PDF</span>
                </button>
                <input type="file" id="gallery-input" class="hidden" accept="image/*" multiple onchange="handleGalleryImport(event)">
            </footer>
        </div>

        <!-- 2. หน้าจอเปิดกล้องสตรีมสด (Live Camera & Document Box) -->
        <div id="screen-camera" class="hidden flex flex-col h-full absolute inset-0 bg-black z-20">
            <header class="absolute top-0 inset-x-0 p-4 flex justify-between items-center z-30 bg-gradient-to-b from-black/80 to-transparent">
                <button onclick="closeCameraScreen()" class="text-white text-lg p-2"><i class="fa-solid fa-xmark"></i></button>
                <span class="text-xs tracking-widest uppercase font-semibold text-blue-400 bg-black/40 px-3 py-1 rounded-full border border-blue-500/30">โหมดสแกนเอกสาร</span>
                <div class="w-8"></div>
            </header>

            <!-- พื้นที่พรีวิวกล้องสดพร้อมกรอบเล็งเอกสาร -->
            <div class="relative flex-grow flex items-center justify-center overflow-hidden">
                <video id="camera-stream" autoplay playsinline class="absolute inset-0 w-full h-full object-cover"></video>
                
                <!-- กรอบจำลองตำแหน่งเอกสารแบบ Mobile Scanner -->
                <div class="absolute w-[82%] h-[75%] border-2 border-dashed border-blue-400/80 rounded-2xl pointer-events-none flex flex-col justify-between p-3 shadow-[0_0_30px_rgba(37,99,235,0.3)]">
                    <div class="flex justify-between"><div class="w-6 h-6 border-t-4 border-l-4 border-blue-500"></div><div class="w-6 h-6 border-t-4 border-r-4 border-blue-500"></div></div>
                    <div class="flex justify-between"><div class="w-6 h-6 border-b-4 border-l-4 border-blue-500"></div><div class="w-6 h-6 border-b-4 border-r-4 border-blue-500"></div></div>
                </div>
            </div>

            <footer class="p-6 bg-black flex justify-center items-center z-30">
                <button onclick="captureImage()" class="w-20 h-20 bg-white rounded-full border-4 border-gray-400 flex items-center justify-center shadow-xl active:scale-95 transition">
                    <div class="w-16 h-16 bg-blue-600 rounded-full"></div>
                </button>
            </footer>
        </div>

        <!-- 3. หน้าจอปรับแต่งฟิลเตอร์ลบรอยดินสอ -->
        <div id="screen-editor" class="hidden flex flex-col h-full absolute inset-0 bg-gray-950 z-30">
            <header class="px-4 py-3 flex justify-between items-center border-b border-gray-800">
                <button onclick="backToHomeFromEditor()" class="text-gray-400 text-sm">ยกเลิก</button>
                <h2 class="font-semibold text-sm">ปรับแต่งเอกสาร</h2>
                <button onclick="saveProcessedPage()" class="text-blue-400 font-semibold text-sm">เสร็จสิ้น</button>
            </header>

            <main class="flex-grow p-4 flex items-center justify-center overflow-hidden">
                <img id="editor-image" class="max-h-[70vh] w-auto object-contain rounded shadow-lg border border-gray-800" alt="Preview">
            </main>

            <div class="p-4 bg-gray-900 border-t border-gray-800 flex justify-around text-xs">
                <button onclick="applyMagicFilter()" class="flex flex-col items-center space-y-1 text-blue-400">
                    <i class="fa-solid fa-wand-magic-sparkles text-base"></i><span>เมจิกลบรอยดินสอ</span>
                </button>
                <button onclick="applyBwFilter()" class="flex flex-col items-center space-y-1 text-gray-400">
                    <i class="fa-solid fa-circle-half-stroke text-base"></i><span>ขาวดำคมชัด</span>
                </button>
            </div>
        </div>

    </div>

    <canvas id="process-canvas" class="hidden"></canvas>

    <script>
        let scannedPages = [];
        let mediaStream = null;
        let tempRawImage = new Image();

        async function openCameraScreen() {
            document.getElementById('screen-home').classList.add('hidden');
            document.getElementById('screen-camera').classList.remove('hidden');
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" } }, audio: false
                });
            } catch (e) {
                try {
                    mediaStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                } catch (err) {
                    alert('ไม่สามารถเปิดกล้องได้ กรุณาตรวจสอบการอนุญาตใช้งานกล้อง');
                    closeCameraScreen();
                    return;
                }
            }
            document.getElementById('camera-stream').srcObject = mediaStream;
        }

        function closeCameraScreen() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
            document.getElementById('screen-camera').classList.add('hidden');
            document.getElementById('screen-home').classList.remove('hidden');
        }

        function captureImage() {
            const video = document.getElementById('camera-stream');
            const canvas = document.getElementById('process-canvas');
            canvas.width = video.videoWidth || 1280;
            canvas.height = video.videoHeight || 720;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            tempRawImage.src = canvas.toDataURL('image/jpeg', 0.95);
            closeCameraScreen();
            
            // เปิดหน้าจอแต่งภาพโดยใช้เมจิกฟิลเตอร์อัตโนมัติ
            openEditorWithImage(tempRawImage.src);
        }

        function handleGalleryImport(e) {
            if (e.target.files && e.target.files.length > 0) {
                Array.from(e.target.files).forEach(file => {
                    const reader = new FileReader();
                    reader.onload = function(evt) {
                        const img = new Image();
                        img.onload = function() {
                            tempRawImage.src = evt.target.result;
                            const processed = processFilter(tempRawImage, 'magic');
                            scannedPages.push(processed);
                            updateUI();
                        };
                        img.src = evt.target.result;
                    };
                    reader.readAsDataURL(file);
                });
                e.target.value = '';
            }
        }

        function openEditorWithImage(src) {
            tempRawImage.src = src;
            document.getElementById('editor-image').src = processFilter(tempRawImage, 'magic');
            document.getElementById('screen-editor').classList.remove('hidden');
        }

        function applyMagicFilter() {
            document.getElementById('editor-image').src = processFilter(tempRawImage, 'magic');
        }

        function applyBwFilter() {
            document.getElementById('editor-image').src = processFilter(tempRawImage, 'bw');
        }

        function processFilter(imgObj, type) {
            const canvas = document.getElementById('process-canvas');
            canvas.width = imgObj.width;
            canvas.height = imgObj.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(imgObj, 0, 0);

            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;

            for (let i = 0; i < data.length; i += 4) {
                let r = data[i], g = data[i+1], b = data[i+2];
                let avg = (r * 0.3) + (g * 0.59) + (b * 0.11);

                if (type === 'magic') {
                    // ดึงรอยดินสอออกและดันพื้นหลังขาวสะอาด
                    if (avg > 160) {
                        data[i] = 255; data[i+1] = 255; data[i+2] = 255;
                    } else {
                        data[i] = Math.min(255, r * 0.6);
                        data[i+1] = Math.min(255, g * 0.6);
                        data[i+2] = Math.min(255, b * 0.6);
                    }
                } else {
                    let v = avg > 140 ? 255 : 0;
                    data[i] = v; data[i+1] = v; data[i+2] = v;
                }
            }
            ctx.putImageData(imgData, 0, 0);
            return canvas.toDataURL('image/jpeg', 0.92);
        }

        function saveProcessedPage() {
            scannedPages.push(document.getElementById('editor-image').src);
            document.getElementById('screen-editor').classList.add('hidden');
            updateUI();
        }

        function backToHomeFromEditor() {
            document.getElementById('screen-editor').classList.add('hidden');
        }

        function updateUI() {
            const grid = document.getElementById('thumbnail-grid');
            document.getElementById('doc-count').innerText = 'เอกสาร: ' + scannedPages.length + ' หน้า';
            
            if (scannedPages.length > 0) {
                document.getElementById('pdf-btn').classList.remove('hidden');
                grid.innerHTML = '';
                scannedPages.forEach((page, index) => {
                    grid.innerHTML += `
                        <div class="relative bg-gray-900 p-2 rounded-xl border border-gray-800 flex flex-col items-center">
                            <img src="${page}" class="h-32 object-contain rounded">
                            <div class="flex justify-between w-full px-2 mt-2 text-xs text-gray-400">
                                <span>หน้า ${index + 1}</span>
                                <button onclick="deletePage(${index})" class="text-red-400"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>`;
                });
            } else {
                document.getElementById('pdf-btn').classList.add('hidden');
                grid.innerHTML = `
                    <div id="empty-state" class="col-span-2 flex flex-col items-center justify-center py-24 text-gray-500">
                        <i class="fa-solid fa-file-lines text-5xl mb-3 opacity-40"></i>
                        <p class="text-sm">ยังไม่มีเอกสาร กดปุ่ม "เปิดกล้องสแกน" ด้านบน</p>
                    </div>`;
            }
        }

        function deletePage(index) {
            scannedPages.splice(index, 1);
            updateUI();
        }

        function generatePDF() {
            if (scannedPages.length === 0) return;
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            scannedPages.forEach((pageData, index) => {
                if (index > 0) doc.addPage();
                doc.addImage(pageData, 'JPEG', 10, 10, 190, 277);
            });
            doc.save('MobileScanner-' + Date.now() + '.pdf');
        }
    </script>
</body>
</html>
